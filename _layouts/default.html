<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfcfe">
  <link rel="icon" type="image/jpeg" href="{{ '/webpage_figures/Profile/profile_square_2.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/webpage_figures/Profile/profile_square_2.jpg' | relative_url }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}">Alperen Kenan</a>
      <nav aria-label="Primary navigation">
        <a href="#about">About</a><a href="#research">Research</a><a href="#publications">Publications</a><a href="#experience">Experience</a><a href="#gallery">Gallery</a><a href="#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer"><div class="container footer-inner"><span>© {{ 'now' | date: '%Y' }} Alperen Kenan</span><span>Robotics · HRI · Teleoperation · Haptics</span></div></footer>
  <script>
    (function () {
      'use strict';

      document.querySelectorAll('.slideshow').forEach(function (show) {
        var slides = Array.prototype.slice.call(show.querySelectorAll('.slide'));
        var dots = show.querySelector('.slide-dots');
        var prev = show.querySelector('.prev');
        var next = show.querySelector('.next');
        if (!slides.length || !dots || !prev || !next) return;

        var index = 0;
        var timer = null;
        var interval = Number(show.dataset.interval) || 6000;

        function renderDots() {
          dots.replaceChildren();
          slides.forEach(function (_, i) {
            var dot = document.createElement('button');
            dot.type = 'button';
            dot.setAttribute('aria-label', 'Show image ' + (i + 1));
            dot.addEventListener('click', function () {
              showSlide(i);
              restart();
            });
            dots.appendChild(dot);
          });
        }

        function showSlide(nextIndex) {
          index = (nextIndex + slides.length) % slides.length;
          slides.forEach(function (slide, i) {
            slide.classList.toggle('active', i === index);
          });
          Array.prototype.forEach.call(dots.children, function (dot, i) {
            dot.classList.toggle('active', i === index);
          });
        }

        function restart() {
          if (timer) window.clearInterval(timer);
          timer = slides.length > 1 ? window.setInterval(function () {
            showSlide(index + 1);
          }, interval) : null;
        }

        renderDots();
        showSlide(0);
        restart();

        prev.addEventListener('click', function () {
          showSlide(index - 1);
          restart();
        });

        next.addEventListener('click', function () {
          showSlide(index + 1);
          restart();
        });

        show.addEventListener('mouseenter', function () {
          if (timer) window.clearInterval(timer);
        });

        show.addEventListener('mouseleave', restart);
      });
    }());
  </script>
</body>
</html>
